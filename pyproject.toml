[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pitchblack-shorts"
version = "0.1.0"
description = "Generate tactical football shorts from structured match data."
requires-python = ">=3.11"
dependencies = [
  "edge-tts",
  "ffmpeg-python",
  "httpx",
  "moviepy",
  "Pillow",
  "PyYAML",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
